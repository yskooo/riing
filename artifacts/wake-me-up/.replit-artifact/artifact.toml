kind = "mobile"
previewPath = "/"
title = "Wake Me Up"
version = "1.0.0"
id = "artifacts/wake-me-up"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 20014

[services.development]
run = "pnpm --filter @workspace/wake-me-up run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wake-me-up", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/wake-me-up", "run", "serve" ]

[services.env]
PORT = "20014"
BASE_PATH = "/"
